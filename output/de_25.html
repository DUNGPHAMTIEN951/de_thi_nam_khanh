<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice 25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .question-block { border-bottom: 1px solid #e2e8f0; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .question-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        input[type="radio"]:checked + span { font-weight: 700; color: #1d4ed8; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        .tooltip-arrow::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid white;
        }
    </style>
</head>
<body class="text-gray-800 antialiased flex h-screen overflow-hidden bg-gray-100">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-72 bg-white shadow-2xl h-full flex flex-col z-30 fixed lg:relative transform -translate-x-full lg:translate-x-0">
        <div class="p-5 bg-blue-700 text-white flex justify-between items-center shrink-0 shadow-md">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                <h1 class="font-bold text-lg leading-tight">Luyện Thi Anh<br><span class="text-sm font-normal text-blue-200">Đề Ôn Tập Chi Tiết</span></h1>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-white hover:text-blue-200 focus:outline-none text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="testList">
            <a href="../index.html" class="w-full block text-center py-3 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-700 mb-4 transition">

            </a>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden w-full">
        <header class="bg-white shadow-sm z-10 shrink-0">
            <div class="px-4 md:px-6 py-4 flex justify-between items-center border-b border-gray-100">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-blue-600 focus:outline-none text-2xl p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 truncate" id="currentTestTitle">ENGLISH PRACTICE 25</h2>
                </div>
                <div class="text-sm font-bold text-blue-700 bg-blue-100 px-4 py-1.5 rounded-full flex items-center shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-pen-nib mr-2"></i> <span id="qCountDisplay">0</span> Câu Hỏi
                </div>
            </div>
            <div class="flex border-b border-gray-200 px-2 md:px-6 bg-gray-50 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('test')" id="tab-test" class="py-3 px-4 md:px-6 text-blue-700 border-b-2 border-blue-600 font-bold focus:outline-none flex items-center gap-2 bg-white whitespace-nowrap">
                    <i class="fa-solid fa-file-pen"></i> Làm Bài Thi
                </button>
                <button onclick="switchTab('flashcard')" id="tab-flashcard" class="py-3 px-4 md:px-6 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none flex items-center gap-2 transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-layer-group"></i> Flashcard
                </button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="py-3 px-4 md:px-6 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none flex items-center gap-2 transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-brain"></i> Ôn Tập Từ Vựng

            </div>
        </header>

        <div class="flex-1 overflow-y-auto relative w-full" id="mainScrollContainer">
            
            <!-- VIEW: TEST (QUIZ) -->

                        <div id="questionsContainer" class="space-y-6"></div>
                        <div class="mt-12 pt-8 border-t-2 border-gray-200 text-center pb-10">
                            <button type="button" onclick="gradeTest('quizForm', 'questions')" class="bg-blue-600 hover:bg-blue-800 text-white font-black py-4 px-16 rounded-full shadow-2xl transition transform hover:scale-105 text-xl tracking-wide">
                                <i class="fa-solid fa-check-double mr-2"></i> NỘP BÀI & CHẤM ĐIỂM
                            </button>
                        </div>
                        <div id="resultArea-questions" class="hidden mt-10 p-8 md:p-12 rounded-3xl text-center border border-gray-100 bg-white shadow-2xl mb-10">
                            <h3 class="text-3xl font-extrabold text-gray-800 mb-2">Kết Quả</h3>
                            <div class="text-7xl font-black mb-6 scoreDisplay">0/0</div>
                            <p class="text-xl text-gray-600 mb-10 font-medium leading-relaxed messageDisplay"></p>
                        </div>
                    </form>
                </div>
            </div>

            <!-- VIEW: FLASHCARDS -->
            <div id="content-flashcard" class="hidden p-4 md:p-8 bg-gray-50 h-full">
                <div class="max-w-3xl mx-auto h-full flex flex-col">
                    <div class="text-center mb-6 shrink-0">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2"><i class="fa-solid fa-layer-group text-blue-500 mr-2"></i>Bộ Thẻ Từ Vựng Thông Minh</h2>
                        <p class="text-gray-600 text-sm md:text-base">Mũi tên <kbd class="bg-gray-200 px-2 py-1 rounded shadow-sm text-xs">Trái</kbd> / <kbd class="bg-gray-200 px-2 py-1 rounded shadow-sm text-xs">Phải</kbd> để chuyển thẻ.</p>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center min-h-[400px] pb-10">
                        <div class="perspective-1000 w-full max-w-lg h-80 cursor-pointer group flip-card" id="flashcardElement" onclick="flipCard()">
                            <div class="flip-card-inner relative w-full h-full transform-style-3d shadow-2xl rounded-[2rem] transition-transform duration-500 ease-out" id="flashcardInner">
                                <div class="backface-hidden absolute w-full h-full bg-white rounded-[2rem] flex flex-col items-center justify-center border border-gray-100 p-8 text-center shadow-lg">
                                    <h3 class="text-4xl md:text-5xl font-black text-blue-700 mb-4 tracking-tight" id="fc-word">Word</h3>
                                    <p class="text-gray-500 text-lg font-medium bg-gray-100 px-4 py-2 rounded-full" id="fc-pron">/pron/</p>
                                </div>
                                <div class="backface-hidden rotate-y-180 absolute w-full h-full bg-gradient-to-br from-blue-600 to-indigo-800 text-white rounded-[2rem] flex flex-col items-center justify-center p-8 shadow-2xl text-center">
                                    <span class="bg-white/20 text-white text-sm font-bold px-4 py-1.5 rounded-full mb-4 uppercase tracking-wider shadow-sm" id="fc-type">Type</span>
                                    <p class="text-3xl md:text-4xl font-bold mb-6 drop-shadow-md" id="fc-meaning">Meaning</p>
                                    <p class="text-lg italic text-blue-50 font-light px-4 leading-relaxed" id="fc-example">"Example sentence"</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-center gap-6 mt-10 w-full max-w-md">
                            <button onclick="prevCard()" id="btnPrev" class="w-14 h-14 rounded-full bg-white text-gray-700 shadow-md hover:shadow-lg hover:text-blue-600 flex items-center justify-center text-xl disabled:opacity-30 border border-gray-100"><i class="fa-solid fa-chevron-left"></i></button>
                            <div class="bg-white px-6 py-3 rounded-full shadow-sm font-bold text-gray-600 text-lg border border-gray-100" id="fc-counter">1 / 1</div>
                            <button onclick="nextCard()" id="btnNext" class="w-14 h-14 rounded-full bg-white text-gray-700 shadow-md hover:shadow-lg hover:text-blue-600 flex items-center justify-center text-xl disabled:opacity-30 border border-gray-100"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW: QUIZ (VOCAB EXERCISES) -->
            <div id="content-quiz" class="hidden p-4 md:p-8">
                <div class="max-w-6xl mx-auto">
                    <form id="vocabQuizForm">
                        <div id="exercisesContainer" class="space-y-6"></div>
                        <div class="mt-12 pt-8 border-t-2 border-gray-200 text-center pb-10">
                            <button type="button" onclick="gradeTest('vocabQuizForm', 'exercises')" class="bg-teal-600 hover:bg-teal-800 text-white font-black py-4 px-16 rounded-full shadow-2xl transition transform hover:scale-105 text-xl tracking-wide">
                                <i class="fa-solid fa-check-double mr-2"></i> CHẤM ĐIỂM TỪ VỰNG
                            </button>
                        </div>
                        <div id="resultArea-exercises" class="hidden mt-10 p-8 md:p-12 rounded-3xl text-center border border-gray-100 bg-white shadow-2xl mb-10">
                            <h3 class="text-3xl font-extrabold text-gray-800 mb-2">Kết Quả Từ Vựng</h3>
                            <div class="text-7xl font-black mb-6 scoreDisplay">0/0</div>
                            <p class="text-xl text-gray-600 mb-10 font-medium leading-relaxed messageDisplay"></p>
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <div id="vocabTooltip" class="fixed z-50 hidden bg-white rounded-xl shadow-2xl border border-gray-200 p-5 w-72 text-left pointer-events-auto transition-opacity duration-200 opacity-0 tooltip-arrow">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h4 class="text-xl font-black text-blue-700 capitalize" id="tt-word">Word</h4>
                    <p class="text-sm text-gray-500 font-medium mt-1" id="tt-pron">/pron/</p>
                </div>
                <button onclick="speakWord()" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center transition shadow-sm border border-blue-100"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded mb-3" id="tt-type">Type</span>
            <p class="text-base text-gray-800 font-bold mb-3" id="tt-meaning">Meaning</p>
            <p class="text-sm text-gray-600 italic border-l-4 border-blue-300 pl-3 leading-relaxed bg-blue-50/50 py-2" id="tt-example">"Example"</p>
        </div>

    </main>

    <script>const database = {"25": {"questions": [{"id": 1, "type": "text", "text": "\"Do you mind if I sit here?\" - \"I'd rather you (sit)...................... over there.\"", "options": null, "answer": "sat", "explanation": "Cấu trúc giả định với 'I'd rather (someone) did something' để diễn tả mong muốn ở hiện tại hoặc tương lai (trái với thực tế hoặc mang tính lịch sự)."}, {"id": 2, "type": "text", "text": "There (be) ………….. no rain here for 6 months.", "options": null, "answer": "has been", "explanation": "Dấu hiệu 'for 6 months' (khoảng thời gian) yêu cầu chia thì Hiện tại hoàn thành để diễn tả sự việc bắt đầu trong quá khứ và kéo dài đến hiện tại."}, {"id": 3, "type": "text", "text": "He spoke to me as if he (be) ………… my father.", "options": null, "answer": "were", "explanation": "Cấu trúc giả định với 'as if / as though'. Vì anh ấy thực tế không phải là cha tôi, ta dùng 'were' (quá khứ giả định) cho tất cả các ngôi."}, {"id": 4, "type": "text", "text": "By the time we (stop) …………, we had driven six hundred miles.", "options": null, "answer": "stopped", "explanation": "Trong cấu trúc 'By the time', hành động xảy ra sau (kết thúc sau) chia ở quá khứ đơn, hành động xảy ra trước (kết thúc trước) chia ở quá khứ hoàn thành."}, {"id": 5, "type": "text", "text": "The price (become) ................... more and more expensive these days.", "options": null, "answer": "is becoming", "explanation": "Dấu hiệu 'these days' và cấu trúc 'more and more' diễn tả một sự thay đổi, xu hướng đang diễn ra ở hiện tại, nên chia thì Hiện tại tiếp diễn."}, {"id": 6, "type": "text", "text": "Pupils are made (work)……………… hard at this school.", "options": null, "answer": "to work", "explanation": "Cấu trúc bị động của động từ 'make': be made + to-V (bị bắt làm gì)."}, {"id": 7, "type": "text", "text": "It’s ten years since I last (see) ………… her.", "options": null, "answer": "saw", "explanation": "Cấu trúc 'It is + thời gian + since + S + (last) + V(quá khứ đơn)'."}, {"id": 8, "type": "text", "text": "Don’t forget (lock) ………… the door before going to bed.", "options": null, "answer": "to lock", "explanation": "Cấu trúc 'forget + to-V': quên phải làm việc gì đó (trong tương lai hoặc bổn phận)."}, {"id": 9, "type": "text", "text": "The pens (produce).............. by Thien Long Company are usually cheap and good.", "options": null, "answer": "produced", "explanation": "Sử dụng rút gọn mệnh đề quan hệ dạng bị động (P2). Những chiếc bút 'được sản xuất' bởi công ty Thiên Long."}, {"id": 10, "type": "text", "text": "The film (begin) ......................at 7.30 or 8.00?", "options": null, "answer": "Does the film begin / Will the film begin", "explanation": "Câu hỏi về lịch trình (thì Hiện tại đơn) hoặc dự định tương lai. Đáp án phổ biến nhất là 'Does the film begin'."}, {"id": 11, "type": "text", "text": "Their children have quite _____________ characters. (DIFFERENCE)", "options": null, "answer": "different", "explanation": "Trước danh từ 'characters' cần một tính từ. 'Different' có nghĩa là khác biệt."}, {"id": 12, "type": "text", "text": "What is the correct ______________of this word? (PRONOUNCE)", "options": null, "answer": "pronunciation", "explanation": "Sau tính từ 'correct' và mạo từ 'the' cần một danh từ. 'Pronunciation' nghĩa là sự phát âm."}, {"id": 13, "type": "text", "text": "He didn’t win the championship, so he felt very _____________ . (HOPE)", "options": null, "answer": "hopeless", "explanation": "Sau động từ chỉ cảm giác 'felt' cần một tính từ. Dựa vào ngữ cảnh 'không thắng' nên dùng 'hopeless' (thất vọng, vô vọng)."}, {"id": 14, "type": "text", "text": "She is one of the greatest _______ to appear in this theater. (PERFORM)", "options": null, "answer": "performers", "explanation": "Cấu trúc 'one of the + danh từ số nhiều'. Cần một danh từ chỉ người: 'performers' (người biểu diễn)."}, {"id": 15, "type": "text", "text": "My house is on the top of a hill. It’s very ____ there in the fall. (WIND)", "options": null, "answer": "windy", "explanation": "Sau trạng từ chỉ mức độ 'very' cần một tính từ để miêu tả thời tiết. 'Windy' nghĩa là nhiều gió."}, {"id": 16, "type": "text", "text": "It is ___________ to eat too much sugar and fatty food. (HEALTH)", "options": null, "answer": "unhealthy", "explanation": "Cấu trúc 'It is + adj + to-V'. Ăn nhiều đường và chất béo là 'unhealthy' (không lành mạnh/có hại cho sức khỏe)."}, {"id": 17, "type": "text", "text": "Many rural areas in Viet Nam have been __________ in the last few years. (URBAN)", "options": null, "answer": "urbanized", "explanation": "Thì hiện tại hoàn thành dạng bị động (have been + P2). 'Urbanized' nghĩa là được đô thị hóa."}, {"id": 18, "type": "text", "text": "Bell ______________ demonstrated his invention. (SUCCESS)", "options": null, "answer": "successfully", "explanation": "Cần một trạng từ bổ nghĩa cho động từ 'demonstrated'. 'Successfully' nghĩa là một cách thành công."}, {"id": 19, "type": "text", "text": "Every day, there are two ____ from Da Nang to Ho Chi Minh city. (FLY)", "options": null, "answer": "flights", "explanation": "Sau số đếm 'two' cần một danh từ số nhiều. 'Flights' nghĩa là các chuyến bay."}, {"id": 20, "type": "text", "text": "There are a lot of _______________ in the competition. (CONTEST)", "options": null, "answer": "contestants", "explanation": "Sau 'a lot of' cần danh từ số nhiều. Cần từ chỉ người tham gia cuộc thi: 'contestants' (thí sinh)."}, {"id": 21, "type": "text", "text": "Lan seemed happily when she received her aunt’s letter. -> Find and correct the error.", "options": null, "answer": "happily -> happy", "explanation": "Sau động từ nối (linking verb) 'seem' ta phải sử dụng một tính từ thay vì trạng từ để miêu tả trạng thái của chủ ngữ."}, {"id": 22, "type": "text", "text": "My brother didn’t have money enough to buy the dictionary he liked. -> Find and correct the error.", "options": null, "answer": "money enough -> enough money", "explanation": "Vị trí của 'enough': 'enough' đứng trước danh từ (enough + noun) nhưng đứng sau tính từ/trạng từ (adj/adv + enough)."}, {"id": 23, "type": "text", "text": "We should put the coffee table among the armchair and the couch. -> Find and correct the error.", "options": null, "answer": "among -> between", "explanation": "Dùng 'between' khi nói về vị trí ở giữa hai đối tượng (armchair và couch). 'Among' dùng cho ba đối tượng trở lên."}, {"id": 24, "type": "text", "text": "The driver of the car was serious injured in the accident. -> Find and correct the error.", "options": null, "answer": "serious -> seriously", "explanation": "Cần một trạng từ (seriously) để bổ nghĩa cho tính từ/quá khứ phân từ 'injured' đứng sau nó."}, {"id": 25, "type": "text", "text": "Everyone was exciting as the prince wanted to choose his wife from the village. -> Find and correct the error.", "options": null, "answer": "exciting -> excited", "explanation": "Sử dụng tính từ đuôi '-ed' (excited) để diễn tả cảm xúc của con người. Tính từ đuôi '-ing' thường dùng để chỉ tính chất của sự vật/sự việc."}, {"id": 26, "type": "text", "text": "He gets up early in order reviewing lessons before school. -> Find and correct the error.", "options": null, "answer": "reviewing -> to review", "explanation": "Cấu trúc chỉ mục đích: 'in order to + V-inf' (để làm gì đó). Do đó 'reviewing' phải chuyển thành 'to review'."}, {"id": 27, "type": "text", "text": "All the students are looking forward to spend their free time relaxing in the sun this summer. -> Find and correct the error.", "options": null, "answer": "spend -> spending", "explanation": "Cấu trúc 'look forward to + V-ing' dùng để diễn tả sự mong đợi, háo hức làm việc gì đó."}, {"id": 28, "type": "text", "text": "I agree that we ought be good students at school and good children at home. -> Find and correct the error.", "options": null, "answer": "ought be -> ought to be", "explanation": "Động từ khuyết thiếu 'ought' luôn đi kèm với 'to' trước một động từ nguyên thể (ought to + V-inf)."}, {"id": 29, "type": "text", "text": "Be careful when you cross a busy street. Look out with cars and trucks. -> Find and correct the error.", "options": null, "answer": "Look out with -> Look out for", "explanation": "Cụm động từ 'look out for someone/something' có nghĩa là coi chừng, cẩn thận với cái gì đó."}, {"id": 30, "type": "text", "text": "Is she accustomed to doing her homework by her? -> Find and correct the error.", "options": null, "answer": "by her -> by herself", "explanation": "Cấu trúc 'by + đại từ phản thân' (by herself) có nghĩa là tự mình làm việc gì đó mà không có sự giúp đỡ."}, {"id": 31, "type": "mcq", "text": "Flood in Dorchester: …… (1) ... six o’clock yesterday evening, the River Thames burst its banks...", "options": {"A": "At", "B": "In", "C": "On", "D": "To"}, "answer": "A", "explanation": "Sử dụng giới từ 'At' trước mốc thời gian cụ thể (giờ giấc)."}, {"id": 32, "type": "mcq", "text": "The main street was soon …… (2)..... 3 feet of water.", "options": {"A": "over", "B": "under", "C": "through", "D": "between"}, "answer": "B", "explanation": "'Under water' nghĩa là dưới mặt nước/bị ngập trong nước."}, {"id": 33, "type": "mcq", "text": "Fire engines arrived quickly to pump away the water, but heavy rain made their job very ……… (3) ..... .", "options": {"A": "easy", "B": "difficult", "C": "fast", "D": "quick"}, "answer": "B", "explanation": "Dựa vào ngữ cảnh 'mưa lớn' (heavy rain), công việc của lính cứu hỏa sẽ trở nên 'khó khăn' (difficult)."}, {"id": 34, "type": "mcq", "text": "Mrs Rose Willow, a ……… (4)......... nearly 80 years old...", "options": {"A": "girl", "B": "child", "C": "widow", "D": "man"}, "answer": "C", "explanation": "'Mrs' chỉ người phụ nữ đã kết hôn, 'widow' (người góa phụ) phù hợp với ngữ cảnh bà cụ 80 tuổi sống một mình."}, {"id": 35, "type": "mcq", "text": "...was trapped upstairs ……… (5)........ three hours.", "options": {"A": "for", "B": "since", "C": "during", "D": "at"}, "answer": "A", "explanation": "Sử dụng 'for' trước một khoảng thời gian (three hours)."}, {"id": 36, "type": "mcq", "text": "Finally, firemen were able to rescue her with ladders and a small ……… (6)..........", "options": {"A": "car", "B": "boat", "C": "plane", "D": "bike"}, "answer": "B", "explanation": "Trong điều kiện lũ lụt ngập nước, phương tiện cứu hộ phù hợp là 'boat' (thuyền)."}, {"id": 37, "type": "mcq", "text": "“She ……… (7)......... me a lot. She sat with me so I didn’t feel afraid”.", "options": {"A": "helped", "B": "frightened", "C": "scared", "D": "hurt"}, "answer": "A", "explanation": "Con mèo ngồi cùng để bà không sợ hãi, tức là nó đã 'giúp đỡ' (helped) bà về mặt tinh thần."}, {"id": 38, "type": "mcq", "text": "...the weather forecast is good, ……… (8) ...........the floods have done a great deal of damage.", "options": {"A": "because", "B": "so", "C": "but", "D": "and"}, "answer": "C", "explanation": "Sử dụng liên từ 'but' để nối hai vế có ý nghĩa tương phản (thời tiết tốt lên nhưng thiệt hại vẫn rất lớn)."}, {"id": 39, "type": "mcq", "text": "“Luckily, nobody was …… (9) ......or injured”", "options": {"A": "killed", "B": "died", "C": "alive", "D": "happy"}, "answer": "A", "explanation": "Cụm từ thường đi đôi 'killed or injured' (bị thiệt mạng hoặc bị thương)."}, {"id": 40, "type": "mcq", "text": "...Chief Fire Office Hawkins …… (10) .......reporters, “but it will take a long time to clear up the mess”.", "options": {"A": "said", "B": "spoke", "C": "told", "D": "talked"}, "answer": "C", "explanation": "Cấu trúc 'tell someone something' (tell + tân ngữ + nội dung). 'Told' là dạng quá khứ của tell."}, {"id": 41, "type": "text", "text": "Vietnam ...(1)... well on its way to integrate with the world", "options": null, "answer": "is", "explanation": "Cấu trúc 'be on its way to' (đang trên đường/trong quá trình). Chủ ngữ Vietnam số ít nên dùng 'is'."}, {"id": 42, "type": "text", "text": "and for that reason emphasis on English language skills ...(2)... become very essential.", "options": null, "answer": "has", "explanation": "Thì hiện tại hoàn thành (has + P2) diễn tả một sự việc vừa mới trở nên thiết yếu. Chủ ngữ là 'emphasis' (sự nhấn mạnh) - số ít."}, {"id": 43, "type": "text", "text": "Recently, the City Department of Education and Training ...(3).. to recruit foreign native English speakers", "options": null, "answer": "planned / decided / wants", "explanation": "Dựa vào 'recently' (gần đây), ta cần một động từ chia ở hiện tại hoàn thành hoặc quá khứ đơn để chỉ kế hoạch/quyết định."}, {"id": 44, "type": "text", "text": "to teach in elementary, middle and ...(4)................................. schools in Vietnam.", "options": null, "answer": "high", "explanation": "Cụm từ chỉ các cấp học: elementary (tiểu học), middle (trung học cơ sở) và high school (trung học phổ thông)."}, {"id": 45, "type": "text", "text": "The policy calls for social contributions to improve English language ...(5).................................", "options": null, "answer": "skills / proficiency / standards", "explanation": "Cần một danh từ đi sau 'English language' để chỉ trình độ hoặc kỹ năng ngôn ngữ."}, {"id": 46, "type": "text", "text": "Each student will chip in VND120,000 ($5.8) a month to ...(6).. the $35 an hour salary", "options": null, "answer": "pay / cover", "explanation": "Đóng góp tiền để 'chi trả' (pay/cover) cho mức lương."}, {"id": 47, "type": "text", "text": "salary of the foreign ...(7)... ...............................", "options": null, "answer": "teachers / speakers / educators", "explanation": "Cần danh từ chỉ người (giáo viên nước ngoài) đã được đề cập ở đoạn trước."}, {"id": 48, "type": "text", "text": "Compared ...(8).. traditional English teaching methodology", "options": null, "answer": "with / to", "explanation": "Cấu trúc 'Compared with/to something' (So với cái gì đó)."}, {"id": 49, "type": "text", "text": "a chance of practicing listening ...(9). ................................ speaking skills", "options": null, "answer": "and", "explanation": "Liên từ 'and' dùng để nối hai kỹ năng nghe và nói."}, {"id": 50, "type": "text", "text": "who create a ...(10)... exciting atmosphere in classrooms for students.", "options": null, "answer": "more / very / really", "explanation": "Cần một trạng từ để bổ nghĩa cho tính từ 'exciting', tạo nên một bầu không khí hào hứng hơn/rất hào hứng."}, {"id": 51, "type": "text", "text": "Rewrite: Couldn’t you find a better hotel? -> Is this...", "options": null, "answer": "Is this the best hotel you could find?", "explanation": "Chuyển từ câu hỏi so sánh hơn sang câu hỏi sử dụng so sánh nhất để giữ nguyên nghĩa."}, {"id": 52, "type": "text", "text": "Rewrite: I haven’t seen that man here before. -> This is...", "options": null, "answer": "This is the first time (that) I have seen that man here.", "explanation": "Cấu trúc: 'I haven't done something before' tương đương với 'This is the first time I have done something'."}, {"id": 53, "type": "text", "text": "Old car tires are recycled to make shoes and sandals. -> People .............................................................................................................................................................................", "options": null, "answer": "People recycle old car tires to make shoes and sandals.", "explanation": "Chuyển từ câu bị động (Passive Voice) sang câu chủ động (Active Voice) ở thì hiện tại đơn."}, {"id": 54, "type": "text", "text": "The coffee is so hot that I can’t drink it. -> The coffee is too ..........................................................................................................................................................", "options": null, "answer": "The coffee is too hot for me to drink.", "explanation": "Chuyển đổi cấu trúc 'so... that' (quá... đến nỗi) sang 'too... for somebody to V' (quá... để cho ai làm gì)."}, {"id": 55, "type": "text", "text": "Somebody repaired his car yesterday. -> He had.............................................................................................................................................................................", "options": null, "answer": "He had his car repaired yesterday.", "explanation": "Sử dụng cấu trúc nhờ vả (Causative form): 'have something done' (có cái gì được làm bởi ai đó)."}, {"id": 56, "type": "text", "text": "It was thought that the painting had been destroyed. -> The painting …………………………………………......................................................................................................", "options": null, "answer": "The painting was thought to have been destroyed.", "explanation": "Chuyển đổi câu bị động khách quan (Impersonal Passive). Vì hành động 'destroyed' xảy ra trước 'thought' nên dùng 'to have been P2'."}, {"id": 57, "type": "text", "text": "Our house is going to be rebuilt by a local firm. -> We are …………………………………………..................................................................................................................", "options": null, "answer": "We are going to have a local firm rebuild our house. / We are having our house rebuilt by a local firm.", "explanation": "Chuyển từ câu bị động sang câu chủ động hoặc cấu trúc nhờ vả, giữ nguyên thì tương lai gần (be going to)."}, {"id": 58, "type": "text", "text": "I can’t buy the tickets. They are too expensive. -> The tickets …………………………………......................................................................................................................", "options": null, "answer": "The tickets are too expensive for me to buy.", "explanation": "Kết hợp hai câu đơn thành một câu sử dụng cấu trúc 'too... for somebody to V'."}, {"id": 59, "type": "text", "text": "Peter spent three hours repainting his house. -> It ........................................................................................................................................................................................", "options": null, "answer": "It took Peter three hours to repaint his house.", "explanation": "Chuyển đổi cấu trúc: 'S + spend + time + V-ing' sang 'It + take + somebody + time + to V'."}, {"id": 60, "type": "text", "text": "Leave now or you will miss the train. -> Unless …………………………………………....................................................................................................................", "options": null, "answer": "Unless you leave now, you will miss the train.", "explanation": "Cấu trúc 'Unless = If... not'. Câu gốc 'Rời đi ngay hoặc bạn sẽ lỡ tàu' tương đương với 'Nếu bạn không rời đi ngay (Trừ khi bạn rời đi ngay), bạn sẽ lỡ tàu'."}, {"id": 61, "type": "text", "text": "information / bringing / entertainment / also / is / only / but / TV / not / .", "options": null, "answer": "TV is not only bringing information but also entertainment.", "explanation": "Sử dụng cấu trúc tương quan 'not only... but also...' (không những... mà còn...) để nối hai danh từ/cụm danh từ."}, {"id": 62, "type": "text", "text": "village / the / definitely / better / Life / the / changing / is / for / in / .", "options": null, "answer": "Life in the village is definitely changing for the better.", "explanation": "Sắp xếp theo trật tự: Chủ ngữ (Life in the village) + to be + trạng từ + V-ing + cụm giới từ. 'Change for the better' là cụm từ cố định nghĩa là thay đổi theo hướng tốt lên."}, {"id": 63, "type": "text", "text": "look for / more money / Farmers / when / family / often / other work / their / need / they / for / .", "options": null, "answer": "Farmers often look for other work when they need more money for their family.", "explanation": "Chủ ngữ (Farmers) + trạng từ chỉ tần suất (often) + động từ (look for) + tân ngữ. Mệnh đề trạng ngữ chỉ thời gian bắt đầu bằng 'when'."}, {"id": 64, "type": "text", "text": "people / still / a week / work / in / Many / days / the countryside / seven / .", "options": null, "answer": "Many people in the countryside still work seven days a week.", "explanation": "Sắp xếp theo trật tự: Cụm chủ ngữ (Many people in the countryside) + trạng từ (still) + động từ (work) + thời gian (seven days a week)."}, {"id": 65, "type": "text", "text": "back / in / months / going / England / They / two / are / .", "options": null, "answer": "They are going back to England in two months.", "explanation": "Sử dụng thì hiện tại tiếp diễn chỉ một kế hoạch trong tương lai: S + be + going back + to + địa điểm + trong khoảng thời gian (in + time)."}, {"id": 66, "type": "text", "text": "Couldn't you find a better hotel? -> Is this ...................................................................?", "options": null, "answer": "Is this the best hotel you could (can) find?", "explanation": "Chuyển đổi từ câu hỏi so sánh hơn sang câu hỏi sử dụng so sánh nhất."}, {"id": 67, "type": "text", "text": "I haven't seen that man here before. -> This is ...................................................................", "options": null, "answer": "This is the first time I have seen that man here.", "explanation": "Sử dụng cấu trúc 'This is the first time + S + present perfect' để diễn tả trải nghiệm lần đầu."}, {"id": 68, "type": "text", "text": "Old car tires are recycled to make shoes and sandals. -> People ...................................................................", "options": null, "answer": "People recycle old car tires to make shoes and sandals.", "explanation": "Chuyển từ câu bị động (Passive Voice) sang câu chủ động (Active Voice) ở thì hiện tại đơn."}, {"id": 69, "type": "text", "text": "The coffee is so hot that I can’t drink it. -> The coffee is too ...................................................................", "options": null, "answer": "The coffee is too hot for me to drink.", "explanation": "Sử dụng cấu trúc 'too + adj + for somebody + to-V' để thay thế cho cấu trúc 'so + adj + that'."}, {"id": 70, "type": "text", "text": "Somebody repaired his car yesterday. -> He had ...................................................................", "options": null, "answer": "He had his car repaired yesterday.", "explanation": "Sử dụng cấu trúc nhờ vả (Causative form): 'have something done' (P2)."}, {"id": 71, "type": "text", "text": "It was thought that the painting had been destroyed. -> The painting ...................................................................", "options": null, "answer": "The painting was thought to have been destroyed.", "explanation": "Chuyển đổi câu bị động kép (Double Passive). Dùng 'to have been P2' vì hành động phá hủy xảy ra trước hành động suy nghĩ."}, {"id": 72, "type": "text", "text": "Our house is going to be rebuilt by a local firm. -> We are ...................................................................", "options": null, "answer": "We are going to have our house rebuilt by a local firm. (Hoặc: We are going to have a local firm rebuild our house)", "explanation": "Chuyển từ câu bị động sang cấu trúc nhờ vả 'have someone do something' hoặc 'have something done'."}, {"id": 73, "type": "text", "text": "I can't buy the tickets. They are too expensive. -> The tickets ...................................................................", "options": null, "answer": "The tickets are too expensive for me to buy.", "explanation": "Kết hợp hai câu sử dụng cấu trúc 'too... for somebody to...'"}, {"id": 74, "type": "text", "text": "Peter spent three hours repainting his house. -> It ...................................................................", "options": null, "answer": "It took Peter 3 hours to repaint his house.", "explanation": "Chuyển đổi giữa hai cấu trúc tương đương: 'S + spend + time + V-ing' sang 'It + take + O + time + to-V'."}, {"id": 75, "type": "text", "text": "Leave now or you will miss the train. -> Unless ...................................................................", "options": null, "answer": "Unless you leave now, you will miss the train.", "explanation": "Cấu trúc 'Unless' thay thế cho 'If... not' hoặc dùng để diễn đạt điều kiện loại trừ. Ở đây, 'Unless you leave now' tương đương với 'If you don't leave now'."}, {"id": 76, "type": "text", "text": "information / bringing / entertainment / also / is / only / but / TV / not / .", "options": null, "answer": "TV is bringing not only information but also entertainment.", "explanation": "Sử dụng cấu trúc tương quan 'not only... but also...' (không những... mà còn...) để nối hai danh từ làm tân ngữ."}, {"id": 77, "type": "text", "text": "village / the / definitely / better / Life / the / changing / is / for / in / .", "options": null, "answer": "Life in the village is definitely changing for the better.", "explanation": "Cụm từ 'change for the better' nghĩa là thay đổi theo chiều hướng tốt đẹp hơn. Trạng từ 'definitely' đứng sau trợ động từ 'is'."}, {"id": 78, "type": "text", "text": "look for / more money / Farmers / when / family / often / other work / their / need / they / for / .", "options": null, "answer": "Farmers often look for other work when they need more money for their family.", "explanation": "Mệnh đề chính: 'Farmers often look for other work'. Mệnh đề phụ chỉ thời gian bắt đầu bằng 'when'."}, {"id": 79, "type": "text", "text": "people / still / a week / work / in / Many / days / the countryside / seven / .", "options": null, "answer": "Many people in the countryside still work seven days a week.", "explanation": "Sắp xếp theo trật tự: Chủ ngữ (Many people in the countryside) + trạng từ (still) + động từ (work) + tân ngữ thời gian (seven days a week)."}, {"id": 80, "type": "text", "text": "back / in / months / going / England / They / two / are / .", "options": null, "answer": "They are going back to England in two months.", "explanation": "Sử dụng thì Hiện tại tiếp diễn (be going) để chỉ một dự định chắc chắn trong tương lai. Cụm 'in two months' nghĩa là trong vòng 2 tháng tới."}], "vocab": [{"word": "I'd rather you + V(past simple)", "pron": "N/A", "type": "structure", "meaning": "Muốn ai đó làm gì (giả định ở hiện tại/tương lai)", "example": "I'd rather you sat over there instead of here."}, {"word": "As if / As though", "pron": "/æz ɪf/", "type": "conjunction", "meaning": "Cứ như thể là (dùng trong câu giả định)", "example": "He spoke to me as if he were my boss."}, {"word": "By the time", "pron": "N/A", "type": "phrase", "meaning": "Vào lúc, trước lúc", "example": "By the time we arrived, the film had already started."}, {"word": "More and more", "pron": "N/A", "type": "structure", "meaning": "Ngày càng (cấu trúc so sánh càng ngày càng)", "example": "The price of gas is becoming more and more expensive."}, {"word": "Be made to do something", "pron": "N/A", "type": "structure", "meaning": "Bị bắt làm việc gì (dạng bị động của make)", "example": "Pupils are made to work hard for the exams."}, {"word": "Since", "pron": "/sɪns/", "type": "conjunction", "meaning": "Kể từ khi (thường nối thì Hiện tại hoàn thành và Quá khứ đơn)", "example": "It’s ten years since I last saw her."}, {"word": "Forget to do something", "pron": "N/A", "type": "structure", "meaning": "Quên phải làm gì (nhiệm vụ, bổn phận)", "example": "Don't forget to lock the door before you leave."}, {"word": "Expensive", "pron": "/ɪkˈspensɪv/", "type": "adjective", "meaning": "Đắt tiền, tốn kém", "example": "Buying a house is very expensive these days."}, {"word": "Pronunciation", "pron": "/prəˌnʌnsiˈeɪʃn/", "type": "noun", "meaning": "Cách phát âm, sự phát âm", "example": "What is the correct pronunciation of this word?"}, {"word": "Urbanized", "pron": "/ˈɜːbənaɪzd/", "type": "adjective/past participle", "meaning": "Được đô thị hóa", "example": "Many rural areas in Vietnam have been urbanized in the last few years."}, {"word": "Contestant", "pron": "/kənˈtestənt/", "type": "noun", "meaning": "Thí sinh, người dự thi", "example": "There are a lot of contestants in the beauty competition."}, {"word": "Successfully", "pron": "/səkˈsesfəli/", "type": "adverb", "meaning": "Một cách thành công", "example": "Alexander Graham Bell successfully demonstrated his invention."}, {"word": "Unhealthy", "pron": "/ʌnˈhelθi/", "type": "adjective", "meaning": "Không lành mạnh, có hại cho sức khỏe", "example": "It is unhealthy to eat too much sugar and fatty food."}, {"word": "Produce", "pron": "/prəˈdjuːs/", "type": "verb", "meaning": "Sản xuất, chế tạo", "example": "The pens produced by this company are cheap and high quality."}, {"word": "Flight", "pron": "/flaɪt/", "type": "noun", "meaning": "Chuyến bay", "example": "There are two flights from Da Nang to Ho Chi Minh city every day."}, {"word": "One of the + superlative adj + plural noun", "pron": "N/A", "type": "structure", "meaning": "Một trong những... nhất (sau đó phải là danh từ số nhiều)", "example": "She is one of the greatest performers to appear in this theater."}, {"word": "Seem + adjective", "pron": "N/A", "type": "structure", "meaning": "Có vẻ như thế nào (động từ nối đi kèm tính từ)", "example": "Lan seemed happy when she received her aunt's letter."}, {"word": "Enough + noun", "pron": "N/A", "type": "structure", "meaning": "Đủ cái gì đó (vị trí của enough đứng trước danh từ)", "example": "My brother didn't have enough money to buy the dictionary."}, {"word": "Between... and...", "pron": "N/A", "type": "structure", "meaning": "Ở giữa hai đối tượng", "example": "Put the coffee table between the armchair and the couch."}, {"word": "Seriously injured", "pron": "/ˈsɪəriəsli ˈɪndʒəd/", "type": "phrase", "meaning": "Bị thương nặng (trạng từ bổ nghĩa cho quá khứ phân từ)", "example": "The driver of the car was seriously injured in the accident."}, {"word": "Excited", "pron": "/ɪkˈsaɪtɪd/", "type": "adjective", "meaning": "Cảm thấy hào hứng, phấn khích (dùng cho cảm xúc con người)", "example": "Everyone was excited to hear the news."}, {"word": "In order to + V-inf", "pron": "N/A", "type": "structure", "meaning": "Để làm gì đó (cấu trúc chỉ mục đích)", "example": "He gets up early in order to review lessons before school."}, {"word": "Among", "pron": "/əˈmʌŋ/", "type": "preposition", "meaning": "Ở giữa nhiều đối tượng (từ 3 trở lên)", "example": "I found my keys among the piles of books on the desk."}, {"word": "Receive", "pron": "/rɪˈsiːv/", "type": "verb", "meaning": "Nhận được", "example": "She was very happy to receive a letter from her old friend."}, {"word": "Look forward to + V-ing", "pron": "N/A", "type": "structure", "meaning": "Mong đợi, trông chờ làm việc gì đó", "example": "All the students are looking forward to spending their free time relaxing."}, {"word": "Ought to + V-inf", "pron": "N/A", "type": "structure", "meaning": "Nên làm gì (diễn tả bổn phận, lời khuyên)", "example": "We ought to be good students at school."}, {"word": "Look out for", "pron": "N/A", "type": "phrasal verb", "meaning": "Coi chừng, cẩn thận với cái gì", "example": "Look out for cars and trucks when you cross the street."}, {"word": "By oneself", "pron": "N/A", "type": "phrase", "meaning": "Tự mình, một mình (không có sự giúp đỡ)", "example": "She did her homework by herself."}, {"word": "Burst its banks", "pron": "/bɜːst its bæŋks/", "type": "idiom/phrase", "meaning": "(Sông) vỡ bờ, tràn bờ", "example": "The River Thames burst its banks and flooded a wide area."}, {"word": "Trap", "pron": "/træp/", "type": "verb", "meaning": "Làm cho kẹt lại, bẫy lại", "example": "The old woman was trapped upstairs for three hours during the flood."}, {"word": "Rescue", "pron": "/ˈreskjuː/", "type": "verb/noun", "meaning": "Giải cứu, sự cứu hộ", "example": "Firemen were able to rescue her with ladders and a small boat."}, {"word": "Damage", "pron": "/ˈdæmɪdʒ/", "type": "noun/verb", "meaning": "Thiệt hại, sự hư hại", "example": "The floods have done a great deal of damage to the town."}, {"word": "Integrate", "pron": "/ˈɪntɪɡreɪt/", "type": "verb", "meaning": "Tích hợp, hội nhập", "example": "Vietnam is on its way to integrate with the world."}, {"word": "Emphasis", "pron": "/ˈemfəsɪs/", "type": "noun", "meaning": "Sự nhấn mạnh, tầm quan trọng", "example": "There is a strong emphasis on English language skills nowadays."}, {"word": "Recruit", "pron": "/rɪˈkruːt/", "type": "verb", "meaning": "Tuyển dụng, chiêu mộ", "example": "The department plans to recruit more foreign native English speakers."}, {"word": "Chip in", "pron": "/tʃɪp ɪn/", "type": "phrasal verb", "meaning": "Góp tiền, đóng góp chung", "example": "Each student will chip in a small amount of money to pay for the teacher's salary."}, {"word": "Methodology", "pron": "/ˌmeθəˈdɒlədʒi/", "type": "noun", "meaning": "Phương pháp luận, hệ phương pháp", "example": "Compared to traditional teaching methodology, this new way is more exciting."}, {"word": "Essential", "pron": "/ɪˈsenʃl/", "type": "adjective", "meaning": "Cần thiết, thiết yếu", "example": "English language skills have become very essential for students."}, {"word": "Compared with/to", "pron": "N/A", "type": "structure", "meaning": "So với...", "example": "Compared to the old hotel, this one is much better."}, {"word": "This is the first time + S + have/has + P2", "pron": "N/A", "type": "structure", "meaning": "Đây là lần đầu tiên ai đó làm gì", "example": "This is the first time I have seen that man here."}, {"word": "Recycle", "pron": "/ˌriːˈsaɪkl/", "type": "verb", "meaning": "Tái chế", "example": "Old car tires are recycled to make shoes and sandals."}, {"word": "Have something done", "pron": "N/A", "type": "structure", "meaning": "Có cái gì được làm bởi ai (Cấu trúc nhờ vả bị động)", "example": "He had his car repaired yesterday."}, {"word": "It takes (sb) time to do sth", "pron": "N/A", "type": "structure", "meaning": "Tốn bao nhiêu thời gian (của ai) để làm việc gì", "example": "It took Peter three hours to repaint his house."}, {"word": "Too + adj + (for sb) + to V", "pron": "N/A", "type": "structure", "meaning": "Quá... (cho ai) để làm gì", "example": "The coffee is too hot for me to drink."}, {"word": "So + adj + that + S + V", "pron": "N/A", "type": "structure", "meaning": "Quá... đến nỗi mà...", "example": "The coffee is so hot that I can't drink it."}, {"word": "Impersonal Passive", "pron": "N/A", "type": "structure", "meaning": "Bị động khách quan (It was thought that.../ The painting was thought to...)", "example": "The painting was thought to have been destroyed."}, {"word": "Repaint", "pron": "/ˌriːˈpeɪnt/", "type": "verb", "meaning": "Sơn lại", "example": "Peter spent three hours repainting his house."}, {"word": "Rebuild", "pron": "/ˌriːˈbɪld/", "type": "verb", "meaning": "Xây dựng lại", "example": "Our house is going to be rebuilt by a local firm."}, {"word": "Unless", "pron": "/ənˈles/", "type": "conjunction", "meaning": "Trừ khi (tương đương với If... not)", "example": "Unless you leave now, you will miss the train."}, {"word": "Not only... but also...", "pron": "N/A", "type": "structure", "meaning": "Không những... mà còn...", "example": "TV is not only bringing information but also entertainment."}, {"word": "Change for the better", "pron": "N/A", "type": "idiom/phrase", "meaning": "Thay đổi theo hướng tốt lên", "example": "Life in the village is definitely changing for the better."}, {"word": "Look for", "pron": "/lʊk fɔː(r)/", "type": "phrasal verb", "meaning": "Tìm kiếm", "example": "Farmers often look for other work during the off-season."}, {"word": "Definitely", "pron": "/ˈdefɪnətli/", "type": "adverb", "meaning": "Chắc chắn, rạch ròi", "example": "The quality of life is definitely improving."}, {"word": "Entertainment", "pron": "/ˌentəˈteɪnmənt/", "type": "noun", "meaning": "Sự giải trí, hình thức giải trí", "example": "Movies and music are popular forms of entertainment."}, {"word": "Information", "pron": "/ˌɪnfəˈmeɪʃn/", "type": "noun", "meaning": "Thông tin", "example": "The internet provides a lot of useful information."}, {"word": "Go back to", "pron": "N/A", "type": "phrasal verb", "meaning": "Trở về (một địa điểm nào đó)", "example": "They are going back to England in two months."}, {"word": "Vocabulary", "pron": "/vəˈkæbjələri/", "type": "noun", "meaning": "Từ vựng", "example": "This section tests your knowledge of English vocabulary."}, {"word": "Grammar", "pron": "/ˈɡræmər/", "type": "noun", "meaning": "Ngữ pháp", "example": "You need to master basic grammar rules to pass the exam."}, {"word": "Phonetics", "pron": "/fəˈnetɪks/", "type": "noun", "meaning": "Ngữ âm học (phát âm, trọng âm)", "example": "The phonetics part includes word stress and pronunciation."}, {"word": "Reading comprehension", "pron": "/ˈriːdɪŋ ˌkɒmprɪˈhenʃn/", "type": "noun", "meaning": "Đọc hiểu", "example": "Section 2 is a reading comprehension task about environmental issues."}, {"word": "Transformation", "pron": "/ˌtrænsfəˈmeɪʃn/", "type": "noun", "meaning": "Sự biến đổi (thường dùng cho dạng bài viết lại câu)", "example": "Sentence transformation is a challenging part of the grammar test."}, {"word": "Key / Answer key", "pron": "/kiː/", "type": "noun", "meaning": "Đáp án / Lời giải", "example": "Please check your results against the answer key provided."}, {"word": "Integrate", "pron": "/ˈɪntɪɡreɪt/", "type": "verb", "meaning": "Tích hợp, hội nhập", "example": "The reading passage discusses how schools integrate technology into learning."}, {"word": "Essential", "pron": "/ɪˈsenʃl/", "type": "adjective", "meaning": "Thiết yếu, cực kỳ quan trọng", "example": "Vocabulary and grammar are essential components of language learning."}, {"word": "Causative form (Have sth done)", "pron": "N/A", "type": "structure", "meaning": "Cấu trúc nhờ vả bị động (Có cái gì đó được làm bởi ai)", "example": "He had his car repaired yesterday."}, {"word": "It takes sb time to do sth", "pron": "N/A", "type": "structure", "meaning": "Ai đó tốn bao nhiêu thời gian để làm việc gì", "example": "It took Peter 3 hours to repair his house."}, {"word": "Too + adj + for sb + to V", "pron": "N/A", "type": "structure", "meaning": "Quá... cho ai đó làm gì (mang nghĩa phủ định)", "example": "The coffee is too hot for me to drink."}, {"word": "Double Passive", "pron": "N/A", "type": "structure", "meaning": "Bị động kép (Dạng: S + be + thought/said + to have P2)", "example": "The painting was thought to have been destroyed."}, {"word": "The first time + Present Perfect", "pron": "N/A", "type": "structure", "meaning": "Lần đầu tiên làm việc gì đó", "example": "This is the first time I have seen that man here."}, {"word": "Recycle", "pron": "/ˌriːˈsaɪkl/", "type": "verb", "meaning": "Tái chế", "example": "People recycle old car tires to make shoes and sandals."}, {"word": "Rebuild", "pron": "/ˌriːˈbɪld/", "type": "verb", "meaning": "Xây dựng lại", "example": "We are going to have our house rebuilt by a local firm."}, {"word": "Expensive", "pron": "/ɪkˈspensɪv/", "type": "adjective", "meaning": "Đắt tiền", "example": "The tickets are too expensive for me to buy."}, {"word": "Unless", "pron": "/ənˈles/", "type": "conjunction", "meaning": "Trừ khi (tương đương với If... not)", "example": "Unless you leave now, you will miss the train."}, {"word": "Not only... but also...", "pron": "N/A", "type": "structure", "meaning": "Không những... mà còn...", "example": "TV is bringing not only information but also entertainment."}, {"word": "Change for the better", "pron": "N/A", "type": "idiom/phrase", "meaning": "Thay đổi theo hướng tốt đẹp hơn", "example": "Life in the village is definitely changing for the better."}, {"word": "Definitely", "pron": "/ˈdefɪnətli/", "type": "adverb", "meaning": "Chắc chắn, dứt khoát", "example": "Life in the village is definitely changing."}, {"word": "Look for", "pron": "/lʊk fɔː(r)/", "type": "phrasal verb", "meaning": "Tìm kiếm", "example": "Farmers often look for other work when they need more money."}, {"word": "Entertainment", "pron": "/ˌentəˈteɪnmənt/", "type": "noun", "meaning": "Sự giải trí, hình thức giải trí", "example": "TV provides various forms of entertainment."}, {"word": "Countryside", "pron": "/ˈkʌntrisaɪd/", "type": "noun", "meaning": "Nông thôn, vùng quê", "example": "Many people in the countryside still work seven days a week."}, {"word": "In + time", "pron": "N/A", "type": "structure", "meaning": "Trong vòng (bao lâu nữa) - dùng cho tương lai", "example": "They are going back to England in two months."}], "exercises": [{"id": 1, "type": "mcq", "text": "The price of gold has become ________ expensive over the last few months.", "options": {"A": "more and more", "B": "most and most", "C": "as and as", "D": "too and too"}, "answer": "A", "explanation": "Cấu trúc so sánh 'more and more + adj' dùng để diễn tả một sự vật/hiện tượng ngày càng tăng tiến."}, {"id": 2, "type": "text", "text": "I'd rather you ________ (not tell) anyone about our secret.", "options": null, "answer": "didn't tell", "explanation": "Cấu trúc 'I'd rather + S + V(quá khứ đơn)' dùng để diễn tả mong muốn ai đó làm/không làm gì ở hiện tại."}, {"id": 3, "type": "mcq", "text": "The teacher made the students ________ all the exercises before leaving.", "options": {"A": "to finish", "B": "finishing", "C": "finish", "D": "finished"}, "answer": "C", "explanation": "Cấu trúc chủ động với make: 'make someone do something' (bắt ai đó làm gì). Ở dạng bị động mới dùng 'be made to do'."}, {"id": 4, "type": "text", "text": "It was a very ________ trip, but we enjoyed every moment of it. (EXPENSE)", "options": null, "answer": "expensive", "explanation": "Cần một tính từ đứng trước danh từ 'trip'. 'Expensive' nghĩa là đắt đỏ/tốn kém."}, {"id": 5, "type": "mcq", "text": "He behaves as if he ________ a billionaire, but he's actually quite poor.", "options": {"A": "is", "B": "was", "C": "were", "D": "be"}, "answer": "C", "explanation": "Cấu trúc giả định 'as if' diễn tả điều không có thật ở hiện tại, động từ 'be' chia là 'were' cho tất cả các ngôi."}, {"id": 6, "type": "text", "text": "Please remember ________ (lock) the safe before you leave the office.", "options": null, "answer": "to lock", "explanation": "Cấu trúc 'remember to do something' nghĩa là nhớ phải làm việc gì đó (như một nhiệm vụ)."}, {"id": 7, "type": "mcq", "text": "By the time the firemen arrived, the fire ________ the entire building.", "options": {"A": "destroyed", "B": "was destroying", "C": "had destroyed", "D": "has destroyed"}, "answer": "C", "explanation": "Hành động phá hủy xảy ra trước hành động đến (arrived) trong quá khứ, nên dùng thì Quá khứ hoàn thành."}, {"id": 8, "type": "text", "text": "I haven't heard from my ________ since he moved to Canada. (FATHER)", "options": null, "answer": "father", "explanation": "Danh từ 'father' (cha) phù hợp để chỉ người trong ngữ cảnh này."}, {"id": 9, "type": "mcq", "text": "It's been a long time ________ we last went to the cinema together.", "options": {"A": "for", "B": "since", "C": "when", "D": "while"}, "answer": "B", "explanation": "Cấu trúc 'It has been + thời gian + since + S + V(quá khứ đơn)'."}, {"id": 10, "type": "text", "text": "The ________ (pupil) were excited about the field trip to the museum.", "options": null, "answer": "pupils", "explanation": "Động từ 'were' là số nhiều, nên danh từ 'pupil' (học sinh) phải chuyển sang dạng số nhiều 'pupils'."}, {"id": 11, "type": "mcq", "text": "Don't ________ to bring your umbrella; the weather forecast says it might rain.", "options": {"A": "forget", "B": "remember", "C": "mind", "D": "rather"}, "answer": "A", "explanation": "'Don't forget' (đừng quên) là cụm từ nhắc nhở làm một việc cần thiết."}, {"id": 12, "type": "text", "text": "I ________ (not see) her for ages; she has changed a lot.", "options": null, "answer": "haven't seen", "explanation": "Dấu hiệu 'for ages' (đã lâu rồi) yêu cầu sử dụng thì Hiện tại hoàn thành."}, {"id": 13, "type": "text", "text": "The products ________ (produce) by that factory are exported to many countries.", "options": null, "answer": "produced", "explanation": "Sử dụng quá khứ phân từ (P2) đóng vai trò như một mệnh đề quan hệ rút gọn mang nghĩa bị động (những sản phẩm được sản xuất)."}, {"id": 14, "type": "mcq", "text": "If you want to improve your speaking, you should focus on your ________.", "options": {"A": "pronounce", "B": "pronouncing", "C": "pronunciation", "D": "pronounced"}, "answer": "C", "explanation": "Sau tính từ sở hữu 'your' cần một danh từ. 'Pronunciation' nghĩa là sự phát âm."}, {"id": 15, "type": "text", "text": "Living in a ________ area is more expensive than living in the countryside. (URBAN)", "options": null, "answer": "urban", "explanation": "Cần một tính từ để bổ nghĩa cho danh từ 'area'. 'Urban' nghĩa là thuộc về thành thị/đô thị."}, {"id": 16, "type": "mcq", "text": "Eating too many snacks and not exercising is very ________.", "options": {"A": "health", "B": "healthy", "C": "healthily", "D": "unhealthy"}, "answer": "D", "explanation": "Dựa vào ngữ cảnh 'ăn vặt nhiều' và 'không tập thể dục', ta cần tính từ mang nghĩa tiêu cực là 'unhealthy' (không lành mạnh)."}, {"id": 17, "type": "text", "text": "She sang so ________ that the audience gave her a standing ovation. (SUCCESS)", "options": null, "answer": "successfully", "explanation": "Cần một trạng từ để bổ nghĩa cho động từ 'sang'. 'Successfully' nghĩa là một cách thành công."}, {"id": 18, "type": "mcq", "text": "How many ________ are taking part in the 'Golden Voice' competition?", "options": {"A": "contests", "B": "contestants", "C": "contesting", "D": "context"}, "answer": "B", "explanation": "Cần danh từ chỉ người tham gia cuộc thi ở số nhiều sau 'how many'. 'Contestants' là thí sinh."}, {"id": 19, "type": "text", "text": "My sister is a great ________; she plays the piano and dances beautifully. (PERFORM)", "options": null, "answer": "performer", "explanation": "Sau mạo từ 'a' và tính từ 'great' cần một danh từ chỉ người. 'Performer' nghĩa là người biểu diễn."}, {"id": 20, "type": "mcq", "text": "We had to cancel our ________ because of the heavy storm.", "options": {"A": "fly", "B": "flying", "C": "flight", "D": "flew"}, "answer": "C", "explanation": "Sau tính từ sở hữu 'our' cần một danh từ. 'Flight' nghĩa là chuyến bay."}, {"id": 21, "type": "text", "text": "It was so ________ that I couldn't open my umbrella. (WIND)", "options": null, "answer": "windy", "explanation": "Cấu trúc 'so + adj + that'. 'Windy' (nhiều gió) là tính từ miêu tả thời tiết phù hợp với ngữ cảnh."}, {"id": 22, "type": "mcq", "text": "There are many ________ between the two brothers' personalities.", "options": {"A": "differ", "B": "different", "C": "differently", "D": "differences"}, "answer": "D", "explanation": "Sau 'many' cần một danh từ số nhiều. 'Differences' nghĩa là những điểm khác biệt."}, {"id": 23, "type": "text", "text": "After failing the exam for the third time, he felt completely ________. (HOPE)", "options": null, "answer": "hopeless", "explanation": "Tính từ 'hopeless' (vô vọng/thất vọng) phù hợp với cảm xúc sau khi thất bại nhiều lần."}, {"id": 24, "type": "mcq", "text": "The ________ was full of energy and kept the kids entertained all evening.", "options": {"A": "perform", "B": "performance", "C": "performer", "D": "performing"}, "answer": "C", "explanation": "Cần một danh từ chỉ người làm chủ ngữ của câu. 'Performer' (người biểu diễn) là đáp án đúng."}, {"id": 25, "type": "mcq", "text": "The children ________ very tired after a long day at the beach.", "options": {"A": "seemed", "B": "seemedly", "C": "was seeming", "D": "seemed like"}, "answer": "A", "explanation": "Sử dụng 'seem' như một linking verb đi kèm với tính từ 'tired' để chỉ trạng thái."}, {"id": 26, "type": "text", "text": "We don't have ________ (money) to buy a new car this year.", "options": null, "answer": "enough money", "explanation": "Trong tiếng Anh, 'enough' đứng trước danh từ để chỉ sự đầy đủ về số lượng."}, {"id": 27, "type": "mcq", "text": "The secret was kept ________ the two best friends for years.", "options": {"A": "among", "B": "between", "C": "in", "D": "at"}, "answer": "B", "explanation": "Dùng 'between' khi đề cập đến mối quan hệ hoặc vị trí giữa hai đối tượng cụ thể."}, {"id": 28, "type": "text", "text": "The hiker was ________ injured after falling from the cliff. (SERIOUS)", "options": null, "answer": "seriously", "explanation": "Cần một trạng từ (seriously) để bổ nghĩa cho tính từ/quá khứ phân từ 'injured'."}, {"id": 29, "type": "mcq", "text": "The football match was so ________ that I couldn't take my eyes off the screen.", "options": {"A": "excited", "B": "excitingly", "C": "exciting", "D": "excitement"}, "answer": "C", "explanation": "Dùng tính từ đuôi '-ing' (exciting) để miêu tả tính chất của sự vật, sự việc (trận đấu)."}, {"id": 30, "type": "text", "text": "She went to the library in ________ to find some information for her project.", "options": null, "answer": "order", "explanation": "Cụm từ 'in order to + V-inf' dùng để chỉ mục đích của hành động."}, {"id": 31, "type": "mcq", "text": "I found my lost ring ________ the tall grass in the garden.", "options": {"A": "between", "B": "among", "C": "next to", "D": "on"}, "answer": "B", "explanation": "Dùng 'among' khi vật nằm giữa một nhóm đối tượng hoặc một đám đông (nhiều ngọn cỏ)."}, {"id": 32, "type": "text", "text": "The students were very ________ about the upcoming school trip. (EXCITE)", "options": null, "answer": "excited", "explanation": "Dùng tính từ đuôi '-ed' (excited) để diễn tả cảm xúc của con người."}, {"id": 33, "type": "mcq", "text": "It was a ________ mistake, but it cost the company a lot of money.", "options": {"A": "serious", "B": "seriously", "C": "seriousness", "D": "serio"}, "answer": "A", "explanation": "Cần một tính từ (serious) để bổ nghĩa cho danh từ 'mistake' đứng sau."}, {"id": 34, "type": "text", "text": "He practiced every day in order ________ the competition. (WIN)", "options": null, "answer": "to win", "explanation": "Sau 'in order' là 'to-infinitive' để chỉ mục đích."}, {"id": 35, "type": "mcq", "text": "Do we have ________ for everyone to sit down?", "options": {"A": "chairs enough", "B": "enough chairs", "C": "too chairs", "D": "enough of chairs"}, "answer": "B", "explanation": "Cấu trúc 'enough + noun' (đủ cái gì đó)."}, {"id": 36, "type": "text", "text": "Upon ________ (receive) the gift, she sent a thank-you note immediately.", "options": null, "answer": "receiving", "explanation": "Sau giới từ 'upon' hoặc 'on', động từ thường được chia ở dạng V-ing."}, {"id": 37, "type": "mcq", "text": "We are really looking forward ________ our grandparents this weekend.", "options": {"A": "to visit", "B": "visiting", "C": "to visiting", "D": "visit"}, "answer": "C", "explanation": "Cấu trúc 'look forward to + V-ing' nghĩa là mong đợi làm việc gì đó."}, {"id": 38, "type": "text", "text": "The heavy rain caused the river to ________ its banks, flooding the nearby crops. (BURST)", "options": null, "answer": "burst", "explanation": "Cụm từ 'burst its banks' dùng để chỉ việc nước sông dâng cao và tràn qua bờ gây lũ lụt."}, {"id": 39, "type": "mcq", "text": "You ________ pay more attention to the teacher's explanation.", "options": {"A": "ought", " B": "ought to", "C": "should to", "D": "must to"}, "answer": "B", "explanation": "Cấu trúc 'ought to + V-inf' dùng để đưa ra lời khuyên, tương tự như 'should'."}, {"id": 40, "type": "text", "text": "The storm caused a great deal of ________ to the coastal buildings. (DAMAGE)", "options": null, "answer": "damage", "explanation": "Sau cụm từ 'a great deal of' cần một danh từ không đếm được. 'Damage' nghĩa là sự thiệt hại."}, {"id": 41, "type": "mcq", "text": "________ for pickpockets when you are in a crowded bus.", "options": {"A": "Look out", "B": "Look after", "C": "Look up", "D": "Look for"}, "answer": "A", "explanation": "'Look out' (thường đi với 'for') có nghĩa là coi chừng, cẩn thận với mối nguy hiểm."}, {"id": 42, "type": "text", "text": "She managed to finish the entire project by ________ without any help. (HER)", "options": null, "answer": "herself", "explanation": "Cấu trúc 'by + reflexive pronoun' (by herself) có nghĩa là tự mình làm, một mình làm."}, {"id": 43, "type": "mcq", "text": "The brave firemen ________ the child from the burning building.", "options": {"A": "trapped", "B": "rescued", "C": "damaged", "D": "flooded"}, "answer": "B", "explanation": "'Rescued' (giải cứu) là động từ phù hợp nhất về nghĩa trong ngữ cảnh này."}, {"id": 44, "type": "text", "text": "The city was ________ water for several days after the dam broke. (UNDER)", "options": null, "answer": "under", "explanation": "Cụm từ 'under water' dùng để chỉ trạng thái bị ngập lụt."}, {"id": 45, "type": "mcq", "text": "The news of the accident ________ a lot of people in the village.", "options": {"A": "frightened", "B": "frightening", "C": "fright", "D": "frightful"}, "answer": "A", "explanation": "Cần một động từ chia ở thì quá khứ đơn để làm vị ngữ chính trong câu. 'Frightened' nghĩa là làm cho ai đó sợ hãi."}, {"id": 46, "type": "text", "text": "Hundreds of people were ________ in their homes due to the sudden flood. (TRAP)", "options": null, "answer": "trapped", "explanation": "Cấu trúc bị động 'be + P2'. 'Trapped' có nghĩa là bị mắc kẹt."}, {"id": 47, "type": "mcq", "text": "He ________ the boss that he would be late for the meeting.", "options": {"A": "said", "B": "spoke", "C": "told", "D": "talked"}, "answer": "C", "explanation": "Cấu trúc 'tell someone something'. 'Told' có tân ngữ trực tiếp (the boss) theo sau."}, {"id": 48, "type": "text", "text": "They have been ________ to the local climate since they moved here. (ACCUSTOM)", "options": null, "answer": "accustomed", "explanation": "Cấu trúc 'be accustomed to' nghĩa là quen với cái gì/việc gì."}, {"id": 49, "type": "mcq", "text": "The company is looking to ________ new employees for its expansion project.", "options": {"A": "integrate", "B": "recruit", "C": "chip in", "D": "methodology"}, "answer": "B", "explanation": "'Recruit' nghĩa là tuyển dụng, phù hợp với ngữ cảnh tìm kiếm nhân viên mới."}, {"id": 50, "type": "text", "text": "It is ________ for all students to have a basic understanding of computer skills. (ESSENCE)", "options": null, "answer": "essential", "explanation": "Sau động từ 'is' cần một tính từ. 'Essential' nghĩa là thiết yếu/cần thiết."}, {"id": 51, "type": "mcq", "text": "If we all ________ a few dollars, we can buy a great gift for our teacher.", "options": {"A": "chip in", "B": "take in", "C": "fill in", "D": "log in"}, "answer": "A", "explanation": "Phrasal verb 'chip in' có nghĩa là góp tiền chung để mua một thứ gì đó."}, {"id": 52, "type": "text", "text": "Vietnam has been trying to ________ more deeply into the global economy.", "options": null, "answer": "integrate", "explanation": "'Integrate' có nghĩa là hội nhập hoặc tích hợp, thường đi với giới từ 'into' hoặc 'with'."}, {"id": 53, "type": "mcq", "text": "Compared ________ the old curriculum, the new one focuses more on practical skills.", "options": {"A": "for", "B": "at", "C": "with", "D": "by"}, "answer": "C", "explanation": "Cấu trúc so sánh: 'Compared with' hoặc 'Compared to' (So với...)."}, {"id": 54, "type": "text", "text": "There is a lot of ________ on learning through practice in this school. (EMPHASIZE)", "options": null, "answer": "emphasis", "explanation": "Sau 'a lot of' cần một danh từ. 'Emphasis' nghĩa là sự nhấn mạnh."}, {"id": 55, "type": "mcq", "text": "This is the first time I ________ such a beautiful sunset in this city.", "options": {"A": "saw", "B": "see", "C": "have seen", "D": "am seeing"}, "answer": "C", "explanation": "Cấu trúc 'This is the first time + S + Hiện tại hoàn thành'."}, {"id": 56, "type": "text", "text": "The teachers use a modern ________ to help students learn faster. (METHOD)", "options": null, "answer": "methodology", "explanation": "Cần một danh từ chỉ hệ phương pháp giáo dục. 'Methodology' nghĩa là phương pháp luận/hệ phương pháp."}, {"id": 57, "type": "mcq", "text": "The atmosphere in the classroom became very ________ when the game started.", "options": {"A": "excite", "B": "exciting", "C": "excitedly", "D": "excitement"}, "answer": "B", "explanation": "Dùng tính từ '-ing' (exciting) để miêu tả tính chất của sự vật/sự việc (bầu không khí)."}, {"id": 58, "type": "text", "text": "Is this the best laptop you could ________? (FIND)", "options": null, "answer": "find", "explanation": "Sau động từ khuyết thiếu 'could' là động từ nguyên mẫu không 'to'."}, {"id": 59, "type": "mcq", "text": "English language ________ are becoming more important for job seekers.", "options": {"A": "skills", "B": "skillful", "C": "skilled", "D": "skillfully"}, "answer": "A", "explanation": "Cụm danh từ 'language skills' (kỹ năng ngôn ngữ)."}, {"id": 60, "type": "text", "text": "The department is working ________ to improve the quality of education.", "options": null, "answer": "hard", "explanation": "Cần một trạng từ bổ nghĩa cho 'working'. 'Hard' đóng vai trò là trạng từ (làm việc chăm chỉ)."}, {"id": 61, "type": "text", "text": "We should ________ glass bottles and jars to protect the environment. (RECYCLING)", "options": null, "answer": "recycle", "explanation": "Sau động từ khuyết thiếu 'should' cần một động từ nguyên mẫu. 'Recycle' nghĩa là tái chế."}, {"id": 62, "type": "mcq", "text": "I need to get my hair ________ for the wedding next week.", "options": {"A": "cut", "B": "cutting", "C": "to cut", "D": "cuts"}, "answer": "A", "explanation": "Cấu trúc nhờ vả bị động: 'get something done (P2)'. 'Cut' ở đây là dạng quá khứ phân từ."}, {"id": 63, "type": "text", "text": "It ________ me two days to finish reading that thick book.", "options": null, "answer": "took", "explanation": "Cấu trúc 'It takes/took somebody time to do something'. Vì việc đọc đã xong nên dùng thì quá khứ đơn 'took'."}, {"id": 64, "type": "mcq", "text": "The box was ________ heavy for the little boy to carry.", "options": {"A": "so", "B": "too", "C": "enough", "D": "such"}, "answer": "B", "explanation": "Cấu trúc 'too + adj + for somebody to V' (quá... để cho ai làm gì)."}, {"id": 65, "type": "text", "text": "They decided to ________ their old house instead of buying a new one. (BUILD)", "options": null, "answer": "rebuild", "explanation": "Dựa vào ngữ cảnh 'nhà cũ' và 'thay vì mua mới', ta dùng 'rebuild' (xây dựng lại)."}, {"id": 66, "type": "mcq", "text": "The movie was ________ boring that half of the audience left early.", "options": {"A": "too", "B": "such", "C": "so", "D": "very"}, "answer": "C", "explanation": "Cấu trúc 'so + adj + that' (quá... đến nỗi mà...)."}, {"id": 67, "type": "text", "text": "The walls of the living room need ________. (REPAINT)", "options": null, "answer": "repainting / to be repainted", "explanation": "Cấu trúc 'need + V-ing' hoặc 'need + to be P2' mang nghĩa bị động (cần được sơn lại)."}, {"id": 68, "type": "mcq", "text": "She ________ five hours shopping for clothes yesterday.", "options": {"A": "took", "B": "spent", "C": "lasted", "D": "passed"}, "answer": "B", "explanation": "Cấu trúc 'S + spend + time + V-ing' (ai đó dành bao nhiêu thời gian làm gì)."}, {"id": 69, "type": "text", "text": "It is ________ that the hidden treasure is buried somewhere in this forest. (THINK)", "options": null, "answer": "thought", "explanation": "Cấu trúc bị động khách quan 'It is thought that...' (Người ta nghĩ rằng...)."}, {"id": 70, "type": "mcq", "text": "This dress is too expensive ________ me to buy right now.", "options": {"A": "to", "B": "with", "C": "for", "D": "about"}, "answer": "C", "explanation": "Giới từ 'for' đứng trước tân ngữ chỉ người trong cấu trúc 'too... to V'."}, {"id": 71, "type": "text", "text": "I had my bike ________ by the mechanic this morning. (REPAIR)", "options": null, "answer": "repaired", "explanation": "Cấu trúc nhờ vả bị động 'have something done (P2)'. 'Repaired' là quá khứ phân từ của repair."}, {"id": 72, "type": "mcq", "text": "The old bridge is ________ to be unsafe for heavy trucks.", "options": {"A": "thought", "B": "thinking", "C": "thinks", "D": "think"}, "answer": "A", "explanation": "Cấu trúc bị động: 'Something is thought to be...' (Cái gì đó được cho là...)."}, {"id": 73, "type": "mcq", "text": "________ you study harder, you will fail the final exam.", "options": {"A": "If", "B": "Unless", "C": "Because", "D": "When"}, "answer": "B", "explanation": "'Unless' có nghĩa là 'Trừ khi' (If not). Câu này dịch là: Trừ khi bạn học chăm chỉ hơn, bạn sẽ trượt kỳ thi cuối kỳ."}, {"id": 74, "type": "text", "text": "The internet provides a wide range of ________ for users of all ages. (ENTERTAIN)", "options": null, "answer": "entertainment", "explanation": "Sau giới từ 'of' và tính từ 'wide range of' cần một danh từ. 'Entertainment' là sự giải trí."}, {"id": 75, "type": "mcq", "text": "She is ________ coming to the party; she promised me yesterday.", "options": {"A": "definitely", "B": "definiteness", "C": "definite", "D": "definition"}, "answer": "A", "explanation": "Cần một trạng từ (definitely) để bổ nghĩa cho động từ 'coming', nhấn mạnh sự chắc chắn."}, {"id": 76, "type": "text", "text": "He is ________ for a new job because he wants a higher salary.", "options": null, "answer": "looking", "explanation": "Cấu trúc 'look for' có nghĩa là tìm kiếm. Ở đây dùng thì hiện tại tiếp diễn 'is looking'."}, {"id": 77, "type": "mcq", "text": "This new law will bring about a change ________ the better in our society.", "options": {"A": "at", "B": "for", "C": "with", "D": "to"}, "answer": "B", "explanation": "Cụm từ cố định 'change for the better' nghĩa là thay đổi theo hướng tốt lên."}, {"id": 78, "type": "text", "text": "Can you give me some ________ about the train schedule? (INFORM)", "options": null, "answer": "information", "explanation": "Sau 'some' cần một danh từ. 'Information' là danh từ không đếm được mang nghĩa thông tin."}, {"id": 79, "type": "mcq", "text": "The new smartphone is not ________ fast but also very stylish.", "options": {"A": "only", "B": "just", "C": "even", "D": "really"}, "answer": "A", "explanation": "Cấu trúc tương quan 'not only... but also...' (không những... mà còn...)."}, {"id": 80, "type": "text", "text": "They are planning to go ________ to their hometown after five years living abroad.", "options": null, "answer": "back", "explanation": "Cụm động từ 'go back' có nghĩa là trở về."}, {"id": 81, "type": "mcq", "text": "In the ________, many people still rely on traditional farming methods.", "options": {"A": "countryside", "B": "city", "C": "skyscraper", "D": "factory"}, "answer": "A", "explanation": "Dựa vào ngữ cảnh 'farming methods' (phương pháp làm nông), địa điểm phù hợp nhất là 'countryside' (nông thôn)."}, {"id": 82, "type": "text", "text": "The ________ in this area are very hardworking, even in bad weather. (FARM)", "options": null, "answer": "farmers", "explanation": "Cần một danh từ chỉ người đóng vai trò chủ ngữ số nhiều. 'Farmers' là những người nông dân."}, {"id": 83, "type": "mcq", "text": "We will be back in ________ months, so don't worry about us.", "options": {"A": "two", "B": "second", "C": "twice", "D": "double"}, "answer": "A", "explanation": "Cần một số đếm để chỉ số lượng tháng. 'Two months' là hai tháng."}, {"id": 84, "type": "text", "text": "Don't forget to take an umbrella, ________ you want to get wet.", "options": null, "answer": "unless", "explanation": "Câu mang nghĩa: Đừng quên mang ô, trừ khi bạn muốn bị ướt."}, {"id": 85, "type": "mcq", "text": "The _______ section of the exam focuses on how words are pronounced and stressed.", "options": {"A": "Grammar", "B": "Phonetics", "C": "Vocabulary", "D": "Reading"}, "answer": "B", "explanation": "'Phonetics' là ngữ âm học, liên quan đến cách phát âm và trọng âm của từ."}, {"id": 86, "type": "text", "text": "It is _______ to check the answer keys after finishing the practice test. (ESSENCE)", "options": null, "answer": "essential", "explanation": "Cần một tính từ sau 'It is'. 'Essential' nghĩa là thiết yếu hoặc cực kỳ quan trọng."}, {"id": 87, "type": "mcq", "text": "To improve your _______, you should read more books and look up new words in the dictionary.", "options": {"A": "vocabulary", "B": "phonetic", "C": "grammatical", "D": "reading"}, "answer": "A", "explanation": "Việc đọc sách và tra từ điển giúp cải thiện 'vocabulary' (vốn từ vựng)."}, {"id": 88, "type": "text", "text": "The teacher asked the students to _______ the two sentences into one using a relative pronoun. (TRANSFORM)", "options": null, "answer": "transform", "explanation": "Cấu trúc 'ask someone to do something'. 'Transform' nghĩa là biến đổi hoặc chuyển đổi."}, {"id": 89, "type": "mcq", "text": "In the _______ part, you have to find information from the passage to answer the questions.", "options": {"A": "Phonetics", "B": "Grammar", "C": "Reading", "D": "Vocabulary"}, "answer": "C", "explanation": "Phần 'Reading' (Đọc hiểu) yêu cầu tìm thông tin từ đoạn văn để trả lời."}, {"id": 90, "type": "text", "text": "The school is trying to _______ new technology into its traditional teaching methods.", "options": null, "answer": "integrate", "explanation": "'Integrate' có nghĩa là tích hợp hoặc kết hợp cái gì đó vào một hệ thống."}, {"id": 91, "type": "mcq", "text": "Each correct answer in this section will be awarded 0.1 _______.", "options": {"A": "points", "B": "grades", "C": "marks", "D": "levels"}, "answer": "A", "explanation": "Trong thang điểm, 'points' (điểm số) được dùng để chỉ đơn vị điểm cho mỗi câu đúng."}, {"id": 92, "type": "text", "text": "You made too many _______ errors in your essay, so you got a low mark. (GRAMMAR)", "options": null, "answer": "grammatical", "explanation": "Cần một tính từ để bổ nghĩa cho danh từ 'errors'. 'Grammatical errors' là lỗi ngữ pháp."}, {"id": 93, "type": "mcq", "text": "Please write your answers in the 'Your _______' box provided at the bottom of the page.", "options": {"A": "Questions", "B": "Keys", "C": "Answers", "D": "Scores"}, "answer": "C", "explanation": "'Your answers' (Câu trả lời của bạn) là mục thường thấy trong các phiếu làm bài."}, {"id": 94, "type": "text", "text": "The teacher provided the _______ key so that students could self-correct their work. (ANSWER)", "options": null, "answer": "answer", "explanation": "Cụm danh từ ghép 'answer key'
