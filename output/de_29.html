<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice 29</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .question-block { border-bottom: 1px solid #e2e8f0; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .question-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        input[type="radio"]:checked + span { font-weight: 700; color: #1d4ed8; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        .tooltip-arrow::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid white;
        }
    </style>
</head>
<body class="text-gray-800 antialiased flex h-screen overflow-hidden bg-gray-100">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-72 bg-white shadow-2xl h-full flex flex-col z-30 fixed lg:relative transform -translate-x-full lg:translate-x-0">
        <div class="p-5 bg-blue-700 text-white flex justify-between items-center shrink-0 shadow-md">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                <h1 class="font-bold text-lg leading-tight">Luyện Thi Anh<br><span class="text-sm font-normal text-blue-200">Đề Ôn Tập Chi Tiết</span></h1>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-white hover:text-blue-200 focus:outline-none text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="testList">
            <a href="../index.html" class="w-full block text-center py-3 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-700 mb-4 transition">
                <i class="fa-solid fa-house mr-2"></i> Quay lại trang chủ
            </a>
            <!-- Test items can be dynamically added or just link to index -->
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden w-full">
        <header class="bg-white shadow-sm z-10 shrink-0">
            <div class="px-4 md:px-6 py-4 flex justify-between items-center border-b border-gray-100">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-blue-600 focus:outline-none text-2xl p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 truncate" id="currentTestTitle">ENGLISH PRACTICE 29</h2>
                </div>
                <div class="text-sm font-bold text-blue-700 bg-blue-100 px-4 py-1.5 rounded-full flex items-center shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-pen-nib mr-2"></i> <span id="qCountDisplay">0</span> Câu Hỏi
                </div>
            </div>
            <div class="flex border-b border-gray-200 px-2 md:px-6 bg-gray-50 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('test')" id="tab-test" class="py-3 px-4 md:px-6 text-blue-700 border-b-2 border-blue-600 font-bold focus:outline-none flex items-center gap-2 bg-white whitespace-nowrap">
                    <i class="fa-solid fa-file-pen"></i> Làm Bài Thi
                </button>
                <button onclick="switchTab('flashcard')" id="tab-flashcard" class="py-3 px-4 md:px-6 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none flex items-center gap-2 transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-layer-group"></i> Flashcard
                </button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="py-3 px-4 md:px-6 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none flex items-center gap-2 transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-brain"></i> Ôn Tập Từ Vựng
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto relative w-full" id="mainScrollContainer">
            
            <!-- VIEW: TEST (QUIZ) -->
            <div id="content-test" class="p-4 md:p-8">
                <div class="max-w-6xl mx-auto">
                    <form id="quizForm">
                        <div id="questionsContainer" class="space-y-6"></div>
                        <div class="mt-12 pt-8 border-t-2 border-gray-200 text-center pb-10">
                            <button type="button" onclick="gradeTest('quizForm', 'questions')" class="bg-blue-600 hover:bg-blue-800 text-white font-black py-4 px-16 rounded-full shadow-2xl transition transform hover:scale-105 text-xl tracking-wide">
                                <i class="fa-solid fa-check-double mr-2"></i> NỘP BÀI & CHẤM ĐIỂM
                            </button>
                        </div>
                        <div id="resultArea-questions" class="hidden mt-10 p-8 md:p-12 rounded-3xl text-center border border-gray-100 bg-white shadow-2xl mb-10">
                            <h3 class="text-3xl font-extrabold text-gray-800 mb-2">Kết Quả</h3>
                            <div class="text-7xl font-black mb-6 scoreDisplay">0/0</div>
                            <p class="text-xl text-gray-600 mb-10 font-medium leading-relaxed messageDisplay"></p>
                        </div>
                    </form>
                </div>
            </div>

            <!-- VIEW: FLASHCARDS -->
            <div id="content-flashcard" class="hidden p-4 md:p-8 bg-gray-50 h-full">
                <div class="max-w-3xl mx-auto h-full flex flex-col">
                    <div class="text-center mb-6 shrink-0">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2"><i class="fa-solid fa-layer-group text-blue-500 mr-2"></i>Bộ Thẻ Từ Vựng Thông Minh</h2>
                        <p class="text-gray-600 text-sm md:text-base">Mũi tên <kbd class="bg-gray-200 px-2 py-1 rounded shadow-sm text-xs">Trái</kbd> / <kbd class="bg-gray-200 px-2 py-1 rounded shadow-sm text-xs">Phải</kbd> để chuyển thẻ.</p>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center min-h-[400px] pb-10">
                        <div class="perspective-1000 w-full max-w-lg h-80 cursor-pointer group flip-card" id="flashcardElement" onclick="flipCard()">
                            <div class="flip-card-inner relative w-full h-full transform-style-3d shadow-2xl rounded-[2rem] transition-transform duration-500 ease-out" id="flashcardInner">
                                <div class="backface-hidden absolute w-full h-full bg-white rounded-[2rem] flex flex-col items-center justify-center border border-gray-100 p-8 text-center shadow-lg">
                                    <h3 class="text-4xl md:text-5xl font-black text-blue-700 mb-4 tracking-tight" id="fc-word">Word</h3>
                                    <p class="text-gray-500 text-lg font-medium bg-gray-100 px-4 py-2 rounded-full" id="fc-pron">/pron/</p>
                                </div>
                                <div class="backface-hidden rotate-y-180 absolute w-full h-full bg-gradient-to-br from-blue-600 to-indigo-800 text-white rounded-[2rem] flex flex-col items-center justify-center p-8 shadow-2xl text-center">
                                    <span class="bg-white/20 text-white text-sm font-bold px-4 py-1.5 rounded-full mb-4 uppercase tracking-wider shadow-sm" id="fc-type">Type</span>
                                    <p class="text-3xl md:text-4xl font-bold mb-6 drop-shadow-md" id="fc-meaning">Meaning</p>
                                    <p class="text-lg italic text-blue-50 font-light px-4 leading-relaxed" id="fc-example">"Example sentence"</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-center gap-6 mt-10 w-full max-w-md">
                            <button onclick="prevCard()" id="btnPrev" class="w-14 h-14 rounded-full bg-white text-gray-700 shadow-md hover:shadow-lg hover:text-blue-600 flex items-center justify-center text-xl disabled:opacity-30 border border-gray-100"><i class="fa-solid fa-chevron-left"></i></button>
                            <div class="bg-white px-6 py-3 rounded-full shadow-sm font-bold text-gray-600 text-lg border border-gray-100" id="fc-counter">1 / 1</div>
                            <button onclick="nextCard()" id="btnNext" class="w-14 h-14 rounded-full bg-white text-gray-700 shadow-md hover:shadow-lg hover:text-blue-600 flex items-center justify-center text-xl disabled:opacity-30 border border-gray-100"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW: QUIZ (VOCAB EXERCISES) -->
            <div id="content-quiz" class="hidden p-4 md:p-8">
                <div class="max-w-6xl mx-auto">
                    <form id="vocabQuizForm">
                        <div id="exercisesContainer" class="space-y-6"></div>
                        <div class="mt-12 pt-8 border-t-2 border-gray-200 text-center pb-10">
                            <button type="button" onclick="gradeTest('vocabQuizForm', 'exercises')" class="bg-teal-600 hover:bg-teal-800 text-white font-black py-4 px-16 rounded-full shadow-2xl transition transform hover:scale-105 text-xl tracking-wide">
                                <i class="fa-solid fa-check-double mr-2"></i> CHẤM ĐIỂM TỪ VỰNG
                            </button>
                        </div>
                        <div id="resultArea-exercises" class="hidden mt-10 p-8 md:p-12 rounded-3xl text-center border border-gray-100 bg-white shadow-2xl mb-10">
                            <h3 class="text-3xl font-extrabold text-gray-800 mb-2">Kết Quả Từ Vựng</h3>
                            <div class="text-7xl font-black mb-6 scoreDisplay">0/0</div>
                            <p class="text-xl text-gray-600 mb-10 font-medium leading-relaxed messageDisplay"></p>
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <div id="vocabTooltip" class="fixed z-50 hidden bg-white rounded-xl shadow-2xl border border-gray-200 p-5 w-72 text-left pointer-events-auto transition-opacity duration-200 opacity-0 tooltip-arrow">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h4 class="text-xl font-black text-blue-700 capitalize" id="tt-word">Word</h4>
                    <p class="text-sm text-gray-500 font-medium mt-1" id="tt-pron">/pron/</p>
                </div>
                <button onclick="speakWord()" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center transition shadow-sm border border-blue-100"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded mb-3" id="tt-type">Type</span>
            <p class="text-base text-gray-800 font-bold mb-3" id="tt-meaning">Meaning</p>
            <p class="text-sm text-gray-600 italic border-l-4 border-blue-300 pl-3 leading-relaxed bg-blue-50/50 py-2" id="tt-example">"Example"</p>
        </div>

    </main>

    <script>const database = {"29": {"questions": [], "vocab": [], "exercises": []}};

        const currentTestId = "29";
        const testData = database[currentTestId];
        let vocabList = testData.vocab || [];
        let currentVocabIndex = 0;

        function initApp() {
            try {
                if (document.getElementById('testList')) initTestList();
                if (testData) {
                    document.getElementById('qCountDisplay').textContent = (testData.questions || []).length;
                    renderQuestions('questionsContainer', testData.questions);
                    if (testData.exercises) renderQuestions('exercisesContainer', testData.exercises);
                }
                if (typeof loadNotes === 'function') loadNotes();
                if (vocabList.length > 0 && typeof updateFlashcardView === 'function') updateFlashcardView();
            } catch (e) { console.error("Init Error:", e); }
        }

        function renderQuestions(containerId, data) {
            const container = document.getElementById(containerId);
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-400 italic bg-gray-50 rounded-3xl border-2 border-dashed border-gray-200">Không có dữ liệu bài tập cho phần này.</div>';
                return;
            }

            let html = '';
            let i = 0;
            while (i < data.length) {
                let q = data[i];
                
                // CLOZE DETECTION
                if (q.text.includes('(1)') || q.text.includes('(1-') || q.text.includes('(1 –')) {
                    let passageQuestions = [];
                    let passageText = '';
                    let wordBox = [];
                    let j = i;
                    while (j < data.length) {
                        let nextQ = data[j];
                        let numMatch = nextQ.text.match(/\((\d+)[\s\-–)]/);
                        if (numMatch || (j === i)) {
                            passageQuestions.push(nextQ);
                            if (nextQ.answer) {
                                let ans = Array.isArray(nextQ.answer) ? nextQ.answer[0] : nextQ.answer;
                                if (ans.length < 25) wordBox.push(ans);
                            }
                            let cleanedText = nextQ.text.replace(/Write the correct form of verb for \(\d+\):|Write the suitable word to fill in the blank \(\d+\):|Complete the sentence:|Nowadays,/, '').trim();
                            if (numMatch) {
                                let num = numMatch[1];
                                cleanedText = cleanedText.replace(numMatch[0], `
                                    <span class="inline-block relative group/cloze mx-1">
                                        <input type="text" id="${containerId}-q${nextQ.id}" 
                                            class="w-28 px-2 py-0.5 bg-amber-50/50 border-b-2 border-amber-300 focus:border-indigo-600 focus:bg-white outline-none transition-all text-indigo-700 font-bold text-center placeholder:text-amber-200" 
                                            placeholder="(${num})">
                                        <div id="feedback-${containerId}-q${nextQ.id}" class="hidden absolute top-full left-0 z-20 w-48 mt-1"></div>
                                    </span>
                                `);
                            }
                            passageText += cleanedText + ' ';
                            j++;
                        } else { break; }
                    }
                    wordBox = [...new Set(wordBox)].sort(() => Math.random() - 0.5);
                    html += `<div class="glass-card p-8 md:p-10 rounded-[2.5rem] border border-indigo-100 shadow-xl mb-12 bg-gradient-to-br from-white to-indigo-50/20 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-8 opacity-10"><i class="fa-solid fa-feather-pointed text-6xl text-indigo-600"></i></div>
                        <div class="flex items-center gap-3 mb-8">
                            <span class="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-indigo-200">Cloze Test</span>
                        </div>
                        ${wordBox.length > 0 ? `<div class="mb-8 p-6 bg-white/50 rounded-2xl border-2 border-dashed border-indigo-100 flex flex-wrap gap-3 justify-center">
                            ${wordBox.map(w => `<span class="px-4 py-1.5 bg-white shadow-sm border border-indigo-50 rounded-lg text-sm font-bold text-indigo-600 cursor-default hover:scale-105 transition-transform">${w}</span>`).join('')}
                        </div>` : ''}
                        <div class="leading-[2.2] text-gray-700 text-lg font-medium text-justify">${passageText}</div>
                    </div>`;
                    i = j;
                } else if (q.text.length > 500) {
                     html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12 items-start">
                        <div class="glass-card p-8 rounded-[2.5rem] bg-slate-50 border border-slate-200 lg:sticky lg:top-8 max-h-[85vh] overflow-y-auto shadow-inner">
                            <div class="text-gray-800 leading-relaxed text-justify font-medium text-lg italic pr-4">${q.text}</div>
                        </div>
                        <div class="space-y-6">${renderSingleQuestion(q, i + 1, containerId)}</div>
                    </div>`;
                    i++;
                } else {
                    html += renderSingleQuestion(q, i + 1, containerId);
                    i++;
                }
            }
            container.innerHTML = html;
        }

        function renderSingleQuestion(q, idx, containerId) {
            const qTypeIcon = q.type === 'mcq' ? 'fa-list-ul' : 'fa-keyboard';
            const qTypeText = q.type === 'mcq' ? 'Trắc nghiệm' : 'Điền từ';
            return `<div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-xl hover:border-indigo-100 group mb-6">
                <div class="p-6 md:p-8">
                    <div class="flex items-start gap-4 mb-6">
                        <div class="shrink-0 w-12 h-12 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center font-black text-lg border border-slate-100 group-hover:bg-indigo-600 group-hover:text-white transition-all duration-300">${idx}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="px-3 py-1 bg-slate-50 text-slate-500 rounded-lg text-[10px] font-black uppercase tracking-wider border border-slate-100 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors">
                                    <i class="fa-solid ${qTypeIcon}"></i> ${qTypeText}
                                </span>
                            </div>
                            <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-relaxed group-hover:text-indigo-900 transition-colors">${q.text}</h3>
                        </div>
                    </div>
                    <div class="ml-0 md:ml-16 space-y-3">
                        ${q.type === 'mcq' ? Object.entries(q.options || {}).map(([key, val]) => `
                            <label class="flex items-center gap-4 p-4 rounded-2xl border-2 border-slate-50 hover:border-indigo-200 hover:bg-indigo-50/50 cursor-pointer transition-all">
                                <input type="radio" name="${containerId}-q${q.id}" value="${key}" class="w-5 h-5 text-indigo-600 border-slate-300">
                                <span class="flex-1 text-slate-700 font-medium"><b>${key.toUpperCase()}.</b> ${val}</span>
                            </label>
                        `).join('') : `
                            <input type="text" id="${containerId}-q${q.id}" class="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none text-slate-800 font-bold" placeholder="Nhập câu trả lời...">
                        `}
                    </div>
                    <div id="feedback-${containerId}-q${q.id}" class="hidden mt-6 ml-0 md:ml-16"></div>
                </div>
            </div>`;
        }

        function gradeTest(formId, dataKey) {
            const questions = testData[dataKey];
            let score = 0;
            const containerId = (dataKey === 'questions') ? 'questionsContainer' : 'exercisesContainer';
            questions.forEach(q => {
                const feedbackDiv = document.getElementById(`feedback-${containerId}-q${q.id}`);
                feedbackDiv.classList.remove('hidden');
                let isCorrect = false;
                let userAns = '';
                if (q.type === 'mcq') {
                    const selected = document.querySelector(`input[name="${containerId}-q${q.id}"]:checked`);
                    userAns = selected ? selected.value : '';
                    isCorrect = userAns.toLowerCase() === (q.answer || "").toLowerCase();
                } else {
                    const input = document.getElementById(`${containerId}-q${q.id}`);
                    userAns = (input.value || '').trim().toLowerCase();
                    const validAnswers = Array.isArray(q.answer) ? q.answer.map(a => a.toLowerCase()) : [(q.answer || "").toLowerCase()];
                    isCorrect = validAnswers.some(ans => userAns === ans || ans.includes(userAns) && userAns.length > 2);
                }
                if (isCorrect) {
                    score++;
                    feedbackDiv.className = "mt-4 p-5 rounded-2xl bg-emerald-50 text-emerald-800 border-l-4 border-emerald-500 shadow-sm";
                    feedbackDiv.innerHTML = `<div class="font-black text-xs uppercase tracking-widest mb-1 text-emerald-600">Chính xác</div> <p class="text-sm">${q.explanation || ''}</p>`;
                } else {
                    feedbackDiv.className = "mt-4 p-5 rounded-2xl bg-rose-50 text-rose-800 border-l-4 border-rose-500 shadow-sm";
                    feedbackDiv.innerHTML = `<div class="font-black text-xs uppercase tracking-widest mb-1 text-rose-600">Chưa đúng</div> <p class="text-sm">Đáp án: ${Array.isArray(q.answer) ? q.answer[0] : q.answer}</p>`;
                }
            });
            const resultArea = document.getElementById(`resultArea-${dataKey}`);
            resultArea.classList.remove('hidden');
            resultArea.querySelector('.scoreDisplay').textContent = `${score}/${questions.length}`;
            resultArea.scrollIntoView({ behavior: 'smooth' });
            try {
                const finalScoreNum = (score / questions.length) * 10;
                const results = JSON.parse(localStorage.getItem('nam_khanh_results') || '{}');
                results[currentTestId] = Math.round(finalScoreNum * 10) / 10;
                localStorage.setItem('nam_khanh_results', JSON.stringify(results));
            } catch(e) {}
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function flipCard() { document.getElementById('flashcardElement').classList.toggle('flipped'); }
        function nextCard() { if (currentVocabIndex < vocabList.length - 1) { currentVocabIndex++; updateFlashcardView(); } }
        function prevCard() { if (currentVocabIndex > 0) { currentVocabIndex--; updateFlashcardView(); } }
        function updateFlashcardView() {
            const v = vocabList[currentVocabIndex];
            document.getElementById('fc-word').textContent = v.word;
            document.getElementById('fc-pron').textContent = v.pron;
            document.getElementById('fc-type').textContent = v.type;
            document.getElementById('fc-meaning').textContent = v.meaning;
            document.getElementById('fc-example').textContent = `"${v.example}"`;
            document.getElementById('fc-counter').textContent = `${currentVocabIndex + 1} / ${vocabList.length}`;
            document.getElementById('flashcardElement').classList.remove('flipped');
        }
        function switchTab(tab) {
            ['test', 'flashcard', 'quiz'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const content = document.getElementById(`content-${t}`);
                if (btn) btn.className = "py-3 px-6 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none flex items-center gap-2 transition-colors";
                if (content) content.classList.add('hidden');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            const activeContent = document.getElementById(`content-${tab}`);
            if (activeBtn) activeBtn.className = "py-3 px-6 text-blue-700 border-b-2 border-blue-600 font-bold focus:outline-none flex items-center gap-2 bg-white";
            if (activeContent) activeContent.classList.remove('hidden');
            if (tab === 'flashcard') updateFlashcardView();
        }
        function initTestList() {
            const list = document.getElementById('testList');
            if (!list) return;
            list.innerHTML = `<a href="../index.html" class="w-full block text-center py-3 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-700 mb-4 transition">Quay lại trang chủ</a>`;
            for (let i = 1; i <= 30; i++) {
                const isActive = i == currentTestId;
                const link = document.createElement('a');
                link.href = `de_${i}.html`;
                link.className = `flex items-center gap-3 p-3 rounded-xl mb-2 border ${isActive ? 'bg-blue-50 border-blue-200 text-blue-700 font-bold' : 'bg-white border-gray-100 text-gray-600'}`;
                link.innerHTML = `<div class="w-8 h-8 rounded-lg ${isActive ? 'bg-blue-600 text-white' : 'bg-gray-100'} flex items-center justify-center text-xs font-black">${i}</div><span>Đề Thi Số ${i}</span>`;
                list.appendChild(link);
            }
        }
        window.onload = initApp;
</script>
</body>
</html>
